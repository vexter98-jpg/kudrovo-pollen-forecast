name: Update CAMS pollen forecast
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
concurrency:
  group: pollen-forecast
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cdsapi>=0.7.7,<0.8'
      - name: Fetch CAMS forecast
        env:
          CAMS_API_TOKEN: ${{ secrets.CAMS_API_TOKEN }}
        run: python refresh-cams-pollen.py forecast.json
      - name: Publish public forecast file
        run: |
          git add -- forecast.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Update public CAMS forecast'
          git push
